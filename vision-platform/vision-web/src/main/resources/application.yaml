server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: vision-platform
  profiles:
    active: dev
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # forceConnectionTimeZoneToSession: 驱动把平台连接会话 time_zone 设为 Asia/Shanghai,
    # 使 DB 端 DEFAULT CURRENT_TIMESTAMP 生成的日志/业务时间列为北京时间（共享 MySQL 容器全局 UTC, 不动全局配置）。
    # 2026-09-26 修复 242 日志时间差 8h（sys_oper_log/sys_login_log/open_api_log 等 29 处 DB 默认时间列）
    url: jdbc:mysql://${mysql.host:127.0.0.1}:${mysql.port:3306}/${mysql.db:vision_platform}?useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true&serverTimezone=Asia/Shanghai&forceConnectionTimeZoneToSession=true
    username: ${mysql.username:root}
    password: ${mysql.password:root}
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      auto-commit: true
      idle-timeout: 30000
      pool-name: VisionHikariCP
      max-lifetime: 1800000
      connection-timeout: 30000
  # Flyway：V1 基线 = docs/02 全量表结构（含 tenant_id/软删/唯一键全局约定）
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  data:
    redis:
      host: ${redis.host:127.0.0.1}
      port: ${redis.port:6379}
      # 注意：password 不在此处设占位符——空串会让 Redisson 发 AUTH 被无密码 Redis 拒绝。
      # dev 密码在 application-dev.yaml；prod 有密码时用环境变量 SPRING_DATA_REDIS_PASSWORD 注入
      database: ${redis.db:0}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 3000ms

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # 软删约定（docs/02 §0）为 deleted_time NULL 语义，不启用 MP logic-delete 固定值方案，
    # 由查询构造层统一追加 deleted_time IS NULL（M1 任务9 随数据权限一起封装）
  global-config:
    banner: false

springdoc:
  packages-to-scan: com.yujian.vision
  swagger-ui:
    with-credentials: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    root: INFO

vision:
  gb:
    # 平台国标身份（生产必须按分配编码配置并启用强密码, docs/10）
    server-id: 34020000002000000001
    domain: 3402000000
    realm: 3402000000
    default-device-password: "12345678"
    stack-id: main
  security:
    jwt:
      # 生产环境必须从环境变量/密钥管理注入（docs/10 §1），此处仅为开发默认值
      secret: ${vision.jwt.secret:dev-only-secret-change-me-0123456789abcdef}
      # token 硬上限 24h（docs/03 §1.2）；Redis 会话空闲 2h 滑动续期（docs/10 §1 会话超时）
      expire-hours: 24
      idle-hours: 2
    aes:
      # SIP/级联接入密码与节点 sign_secret 的 AES 可逆加密密钥（docs/02 §0 敏感字段）。
      # 生产必须环境变量注入（vision.aes.key），弱默认值会被 ProdSecretGuard 拒绝启动
      key: ${vision.aes.key:dev-only-aes-key-change-me-0123456789abcdef}
      # 旧密钥（可选, 仅密钥轮换窗口临时设置, docs/10 §1 / deploy/README §5.1）：
      # 设置后启动扫描把存量旧密钥密文迁移到当前密钥, 迁移完成即应移除。
      # 平时不设置 = 轮换功能不启用, 行为与既往版本一致
      old-key: ${VISION_AES_OLD_KEY:}
    # Alertmanager webhook 回调令牌（docs/09 M2 #8）: Alertmanager 请求头 X-Vision-Alert-Token
    # 须与此值一致（恒定时间比对, 见 AlertWebhookController）。生产必改 —— 默认值为开发占位,
    # ProdSecretGuard 会在 prod 拒绝启动
    alert-webhook-token: ${vision.alert-webhook-token:dev-alert-token-CHANGE-IN-PROD}
    # 可信代理列表（精确 IP 或 IPv4 CIDR）：直连地址命中才采信 X-Forwarded-For, 否则取 remoteAddr。
    # XFF 取值按追加式语义: 从右向左跳过可信代理取首个非可信地址（$proxy_add_x_forwarded_for 会保留客户端伪造首段, 禁取首段）。
    # 默认空=不信任 XFF（防伪造头绕过限流/防爆破, docs/10 §1）。经 Nginx 反代部署时必须配置, 如 242 上 [127.0.0.1, 172.17.0.1]
    trusted-proxies: []
  crypto:
    # 开放接口 app_secret 的 SM4 可逆加密主密钥（docs/15 决策 D3, 国密化）。
    # 生产必须环境变量注入（vision.sm4.key）; 仅 vision.openapi.enabled=true 时强制校验——
    # 未配置/为开发默认值直接拒绝启动; 未启用开放接口时本配置不生效（仅提示 WARN）
    sm4-key: ${vision.sm4.key:dev-only-sm4-key-change-me-0123456789ab}
  openapi:
    # 开放接口总开关（docs/15 决策 D7）: 默认 false——不装配 SM4 加密器/签名过滤器, 零行为变化
    enabled: false
    # 签名算法（docs/15 决策 D2）: hmac-sm3(默认) | hmac-sha256(配置回退), 其他值启动失败
    signature-algorithm: ${vision.openapi.algorithm:hmac-sm3}
  retention:
    # 数据归档保留天数（docs/06 §7 数据归档清理: 操作/登录日志留存 ≥6 个月, 等保二级基线）
    oper-log-days: 190
    login-log-days: 190
    media-session-days: 30
    # 云端录像保留天数（docs/09 M2 #3 保留策略清理, 每日 02:40 CloudRecordRetentionTask, 连落盘文件一起回收）
    cloud-record-days: 30
    # 软删数据物理回收保留天数（SoftDeletePurgeTask 每日 02:50）: 超期死行物理删除, 留误删恢复窗口
    soft-delete-days: 30
  media:
    # UDP 收流失败自动降级（docs/06 §6）: on_rtp_server_timeout + INVITING + UDP → BYE 旧对话 + TCP 被动 re-INVITE。
    # 每会话至多一次(降级即翻转 tcpMode)。answered-invite-max-seconds: 已应答但流未到的兜底关停秒数(须大于 ZLM timeoutSec+降级窗口)
    udp-fallback-enabled: true
    answered-invite-max-seconds: 60
    # /play/sessions 会话列表观测上限(B6 压测口径, M3-B4 阶段3 参数化): 仅观测接口防全表回包, 压测时按需调大
    sessions-limit: 100
    # 点播收流节点调度策略(M3-B6 阶段1): first=首个在线节点(历史行为)/least-streams=在流数最少(默认,
    # 单点部署与 first 等价)/least-bandwidth=实时带宽最小; 未识别值按 least-streams 兜底
    node-schedule: least-streams
    # 点播建流失败换节点重试次数(M3-B6 阶段2 挂账①): openRtpServer 连接拒绝/SSRC 分配失败时换下一
    # 候选节点重试, 0=关(历史行为)。sendInvite 失败与回放 resume 路径不重试; 指标 vision.invite{result=node-retry}
    invite-node-retries: 1
    # 按需点播(M3-B7, docs/06 §3.1): 播放器拉的流不存在(on_stream_not_found)时, 平台在 ZLM 等待窗口
    # (maxStreamWaitMS, 默认 15s)内自动建流。false=只记日志不建流(须同时在 ZLM config.ini 注册该 hook)
    on-demand-enabled: true
    # 按需建流的码流档: 1=主码流(默认) 2=子码流。仅在无活跃实况会话需新建时生效——streamId 与档位无关,
    # 已有活跃会话(任意档)一律复用, 故本值只决定新建会话的档位
    on-demand-profile: 1
    # 跨节点回源源站 base(M3-B6 阶段1): 默认空=按源节点 hostIp:http_port(多主机部署正确语义;
    # 242 独立容器部署曾因共享层误配 http://zlm:80 导致回源 DNS 解析失败)。拉流 URL 为签名 TS, 过 on_play 鉴权
    # 仅本地单机 compose 部署在 application-dev.yaml 覆盖为服务名 http://zlm:80
    proxy-source-base: ""
    # RTSP 拉流代理探活(M5-B1, docs/14 §6): rtsp-probe-timeout-ms=单台 TCP 连接/OPTIONS 应答超时毫秒;
    # rtsp-probe-fail-threshold=连续失败判离线阈值(防抖, 成功即清零)。探测周期复用设备行 heartbeat_interval,
    # 仅 always_on=0 的按需设备参与(常驻设备在线态由收敛循环按流活跃驱动)
    rtsp-probe-timeout-ms: 3000
    rtsp-probe-fail-threshold: 3
  play:
    # 播放地址外部 base（docs/03 §4.1 / docs/04 §5, B5 HTTPS-ready 伴生项）: 默认空=按节点 public_ip:http_port 拼 http/ws；
    # 配置后全量覆盖(如反代域名 https://media.example.com), ws/wss 按方案自动推导, HTTPS 化时平台代码零改动
    public-base: ""
  snapshot:
    # 服务端抓图（M3-B7 阶段2）总开关: 关=不自动抓、手动抓图接口 1013 拒绝、清理任务停扫目录
    enabled: true
    # 空闲通道抓图: 对无流通道临时建流（2~4s 收流, 抓完即停; 属带宽成本能力, 默认关）。
    # 242 真机验证"抓完即停"时临时设 VISION_SNAPSHOT_IDLE_ENABLED=true 重启, 验完改回 false——
    # 常态保持 false, 避免频繁开关重启
    idle-enabled: false
    # 点播流就绪自动抓一张（只受 enabled 约束, 与 idle-enabled 无关）: on_stream_changed regist=true 后
    # 延迟 auto-delay-seconds 再抓（等 ZLM 首帧稳定防黑帧）; 已有图未超 auto-refresh-seconds 则跳过（0=仅无图时抓）
    auto-on-play: true
    auto-refresh-seconds: 1800
    # 图片落盘目录（prod 用环境变量 VISION_SNAPSHOT_DIR=/opt/vision/data/snapshot, 见 deploy/README §5;
    # dev 默认 ./data/snapshot, 仓库已 ignore）
    dir: "./data/snapshot"
    # 抓帧总预算毫秒（含占位图轮询; 单次 getSnap 的 timeout_sec 跟随剩余预算, 上限 15s）。
    # 15s 依据 242 真机实测: H265 冷抓第一帧需 4~5.4s。**勿调小到 5s 以下**——提前掐断会把
    # ZLM 的 snap 播放器留在"占位图卡死"态, 之后同一 url 全部秒回 PNG, 表现为永久 1013
    timeout-ms: 15000
    # 占位图轮询间隔毫秒（ZLM 流未就绪回 PNG 占位图, 按此步长重试至预算耗尽）
    poll-interval-ms: 500
    # 点播自动抓图延迟秒
    auto-delay-seconds: 3
    # 缩略图宽 160（列表"截图"列用, 另存小图防 20 行 x 原图 3MB/页; 等比缩放不放大, 失败回退原图）
    thumb-width: 160
    # 截图签名 URL TTL 秒（免登录读图, 泄露仅暴露单张通道截图）
    url-ttl-seconds: 300
    # 空闲抓图临时建流的码流档: 1=主码流(默认) 2=子码流（子码流省带宽）
    idle-profile: 1
    # 抓图执行并发（独立调度池线程数, 与 hook 串行池/异步池隔离）
    concurrency: 4
  rate-limit:
    # 接口级限流（docs/10 §1）: Redis 固定窗口计数, 触发返回 1009。limits 为每分钟次数（login 按 IP 维度, play 按登录用户维度）
    enabled: true
    limits:
      login: 60
      play: 120
  catalog:
    # 周期目录全量刷新（docs/06 §7）：GB28181 无强制的下级目录变更推送, 靠上级周期重查对齐名称/增删通道。
    # 默认关闭; 测试/级联环境开启后可把 refresh-cron 改为更高频率（如每 10 分钟 "0 */10 * * * ?"）
    auto-refresh-enabled: false
    refresh-cron: "0 17 4 * * ?"
  ha:
    # SIP 主备高可用(M3-B6 阶段2, deploy/README §8): 默认关=单机部署行为零变化。
    # 双实例部署时 A/B 差异全部走环境变量(SERVER_ADDRESS/VISION_HA_*/VISION_SIP_AUTOSTART),
    # keepalived 只做健康状态机+notify 编排(vrrp_script 探 /actuator/health), 平台机制不依赖 keepalived
    enabled: ${VISION_HA_ENABLED:false}
    # 启动角色: active=抢租约定身份(生产 A)/standby=恒备用等接管指令(生产 B)
    role: ${VISION_HA_ROLE:active}
    # 内部管理口令牌(/api/ha/internal/*, X-Vision-Ha-Token 恒定时间比对); prod 启用 HA 时 ProdSecretGuard 拒弱值
    token: ${VISION_HA_TOKEN:dev-ha-token-CHANGE-IN-PROD}
    # 备台态 SIP 耦合写操作转发对端(活跃实例)
    peer-base-url: ${VISION_HA_PEER_BASE_URL:http://127.0.0.1:8082}
    forward-prefixes: [/api/play, /api/playback, /api/talk, /api/records, /api/record, /api/ptz, /api/devices, /api/channels, /api/cascade]
    forward-methods: [POST, PUT, DELETE]
    # 转发读超时 30s（评审 P1-2）: 手动抓图 POST /api/channels/{id}/snapshot 同步执行最坏 ~23s
    # （空闲建流 8s + 抓帧预算 15s）, 超时会在备台侧假 503 而主侧实际成功。
    # 切换感知不受影响——对端宕机走 connect 拒绝（HaPeerClient/转发 client connectTimeout 2~3s 快速失败）,
    # 读超时只在"对端活着但慢"时生效
    forward-timeout-ms: 30000
    # Redis 领导租约: 单 key 30s TTL, 启动抢约定身份; 与设备注册绑定(gb_device)无关
    leader-key: gb:ha:leader
    lease-seconds: 30
