# ============================================================================
# YuJianVision 单机标准形态 · docker compose 全容器化部署
# 本目录是【入库模板】; 实际部署包实例目录（deploy/deployment/, git ignore）制作:
#   1) cp -r deploy/compose/* <实例目录>/    2) .env 与 vision.env 照 .example 填真值
#   3) zlm/config.ini 的 CHANGE_ME_FILL_AT_DEPLOY 全部替换为真实 secret
#   4) app/ 放入 vision-platform.jar 与 dist/    5) docker compose up -d
# 镜像全部公共仓库联网拉取、无自建镜像; jar/dist 以挂载进容器（升级=换文件+restart, 见 README）。
# ============================================================================
name: vision

services:
  mysql:
    image: mysql:8.4
    container_name: vision-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?在 .env 填 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-vision_platform}
      MYSQL_USER: ${MYSQL_USER:-vision}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?在 .env 填 MYSQL_PASSWORD}
      TZ: Asia/Shanghai
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"   # 仅绑宿主回环（运维直连）; 不对网段开放
    volumes:
      - ./data/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: vision-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?在 .env 填 REDIS_PASSWORD}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"   # 仅绑宿主回环
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 12

  zlm:
    image: zlmediakit/zlmediakit:master
    container_name: vision-zlm
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    ports:
      - "${ZLM_HTTP_PORT:-8081}:80"        # HTTP API / HTTP-FLV / TS / HLS
      - "${ZLM_RTSP_PORT:-554}:554"
      - "${ZLM_RTMP_PORT:-1935}:1935"
      # RTP 收流段: tcp+udp 必须同时映射（GB 设备 TCP 被动/UDP 兜底两形态）; 段大小=最大并发收流路数
      - "${ZLM_RTP_START:-30000}-${ZLM_RTP_END:-30500}:${ZLM_RTP_START:-30000}-${ZLM_RTP_END:-30500}/tcp"
      - "${ZLM_RTP_START:-30000}-${ZLM_RTP_END:-30500}:${ZLM_RTP_START:-30000}-${ZLM_RTP_END:-30500}/udp"
    volumes:
      - ./zlm/config.ini:/opt/media/conf/config.ini:ro
      - ./data/zlm/log:/opt/media/log
      - ./data/zlm/www:/opt/media/www

  platform:
    image: eclipse-temurin:17-jre
    container_name: vision-platform
    restart: unless-stopped
    # jar 挂载进容器（免自建镜像）; MaxRAMPercentage 配合 compose mem_limit 可用
    command: ["java", "-XX:MaxRAMPercentage=75.0", "-jar", "/app/vision-platform.jar"]
    env_file:
      - ./vision.env
    environment:
      TZ: Asia/Shanghai
      # 组件互访走 compose 内网服务名 DNS——在此写死覆盖, vision.env 里无需也不必再配 host
      MYSQL_HOST: mysql
      SPRING_DATA_REDIS_HOST: redis
    ports:
      - "${API_PORT:-8082}:8082"           # REST API + WS（运维直连/监控抓取; 终端用户走 8090 反代）
      - "${SIP_PORT:-5060}:5060/udp"       # SIP 信令（对设备网段开放）
      - "${SIP_PORT:-5060}:5060/tcp"
    volumes:
      - ./app/vision-platform.jar:/app/vision-platform.jar:ro
      - ./logs:/app/logs
      - ./data/snapshot:/app/data/snapshot
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      zlm:
        condition: service_started
    healthcheck:
      # temurin 镜像无 curl/wget, 用 bash 内建 /dev/tcp 探 REST 端口
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8082"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 60s

  webui:
    image: nginx:1.28-alpine
    container_name: vision-webui
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    ports:
      - "${WEBUI_PORT:-8090}:80"           # 前端唯一入口（终端用户只开这一端口）
    volumes:
      - ./app/dist:/usr/share/nginx/html:ro
      - ./webui/nginx-default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      platform:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6

networks:
  default:
    name: vision-net
    ipam:
      config:
        # 固定网段: vision.env 的 VISION_SECURITY_TRUSTEDPROXIES_0 按此 CIDR 配置（容器 IP 漂移免疫）,
        # 与其它 docker 网段冲突时两处（此处 + vision.env）同步修改
        - subnet: 172.30.0.0/24
