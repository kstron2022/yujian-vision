# ============================================================================
# webui nginx 配置（docker compose 单机形态; 改造自生产现行版, 双上游 HA 退化为单上游服务名）
# 终端用户唯一入口: API/WS/播放流全部经本反代, 浏览器永不直连 8082/8081
# ============================================================================
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}
upstream vision_api {
    server platform:8082;    # compose 服务名 DNS
}
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 20m;

    # SPA 前端
    location / {
        try_files $uri $uri/ /index.html;
    }

    # WASM 静态资源(jessibuca 软解 decoder): 老镜像 mime.types 可能缺 application/wasm,
    # 缺失时 compileStreaming 会拒载——显式兜底
    location ~* \.wasm$ {
        default_type application/wasm;
    }

    # 平台 API
    location /api/ {
        proxy_pass http://vision_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # WebSocket 事件推送
    location /ws/ {
        proxy_pass http://vision_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 播放流: http-flv/ts 直连 + ws-flv 升级（同源免跨域）; 指向 zlm 容器内 HTTP(80), 禁缓冲
    location /rtp/ {
        proxy_pass http://zlm:80;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }
}
