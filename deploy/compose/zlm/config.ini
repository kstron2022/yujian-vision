# ============================================================================
# ZLMediaKit 配置模板（docker compose 单机形态）
# 部署前必改: 把 CHANGE_ME_FILL_AT_DEPLOY 全部替换为真实 secret（与 .env 注释里说的
# 平台「流媒体节点」页所填 secret 同一值）; 生成: openssl rand -hex 16
#   sed -i 's/CHANGE_ME_FILL_AT_DEPLOY/<真实secret>/g' zlm/config.ini
# hook 指向 compose 服务名 platform（内网 DNS, 免宿主 IP 依赖）
# ============================================================================
[api]
apiDebug=1
defaultSnap=./www/logo.png
downloadRoot=./www
secret=CHANGE_ME_FILL_AT_DEPLOY
snapRoot=./www/snap/

[general]
enableVhost=0
mediaServerId=vision-zlm
maxStreamWaitMS=15000
# 无观众判死窗口: 18s 对"流已注册但浏览器还没接上"太紧（INVITE 最长 15s + 前端 3s 轮询起播
# + 软解 WASM 冷加载）→ 平台 none_reader 钩子误杀活跃会话。60s 留足接流空窗, 平台侧另有
# 关前读者复核与前端自愈重播兜底（M5-B3）
streamNoneReaderDelayMS=60000
wait_track_ready_ms=10000
wait_add_track_ms=3000
wait_audio_track_data_ms=1000
unready_frame_cache=100

[hls]
segDur=2
segNum=3
segRetain=5
segKeep=0

[hook]
admin_params=secret=CHANGE_ME_FILL_AT_DEPLOY
alive_interval=30.000000
enable=1
on_flow_report=
on_http_access=
on_play=http://platform:8082/api/hooks/on_play?secret=CHANGE_ME_FILL_AT_DEPLOY
on_publish=http://platform:8082/api/hooks/on_publish?secret=CHANGE_ME_FILL_AT_DEPLOY
on_record_mp4=
on_record_ts=
on_rtp_server_timeout=http://platform:8082/api/hooks/on_rtp_server_timeout?secret=CHANGE_ME_FILL_AT_DEPLOY
on_rtsp_auth=
on_rtsp_realm=
on_send_rtp_stopped=http://platform:8082/api/hooks/on_send_rtp_stopped?secret=CHANGE_ME_FILL_AT_DEPLOY
on_server_exited=
on_server_keepalive=http://platform:8082/api/hooks/on_server_keepalive?secret=CHANGE_ME_FILL_AT_DEPLOY
on_server_started=http://platform:8082/api/hooks/on_server_started?secret=CHANGE_ME_FILL_AT_DEPLOY
on_shell_login=
on_stream_changed=http://platform:8082/api/hooks/on_stream_changed?secret=CHANGE_ME_FILL_AT_DEPLOY
on_stream_none_reader=http://platform:8082/api/hooks/on_stream_none_reader?secret=CHANGE_ME_FILL_AT_DEPLOY
on_stream_not_found=http://platform:8082/api/hooks/on_stream_not_found?secret=CHANGE_ME_FILL_AT_DEPLOY
retry=1
retry_delay=3.000000
stream_changed_schemas=rtsp/rtmp/fmp4/ts/hls/hls.fmp4
timeoutSec=10

[http]
allow_cross_domains=1
charSet=utf-8
keepAliveSecond=15
maxReqSize=40960
port=80
rootPath=./www
sendBufSize=65536
sslport=443

[protocol]
# 音频剥离（B5 决策）: G.711 会致 mpegts.js 解复用异常; AAC 环境可改 1 并逐台核对设备
enable_audio=0
enable_fmp4=1
enable_hls=1
enable_hls_fmp4=0
enable_mp4=0
enable_rtmp=1
enable_rtsp=1
enable_ts=1
modify_stamp=2

[rtp_proxy]
gop_cache=1
port_range=30000-30500
timeoutSec=15
udp_recv_socket_buffer=4194304

[rtsp]
authBasic=0
port=554
sslport=332

[rtmp]
port=1935
sslport=19350

[shell]
port=9000

[srt]
port=9000
