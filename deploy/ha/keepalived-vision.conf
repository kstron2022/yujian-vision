# SIP 主备 · 同机双实例形态（见 deploy/部署手册.md §8）
# keepalived 只做健康状态机 + notify 编排, 不管理 VIP 地址:
#   VIP(10.0.0.243/32) 常驻 lo(standby unit ExecStartPre 固化; netplan 不支持 lo),
#   B 的 REST 绑 VIP:8082 常驻服务管理面;
#   设备 SIP 注册地址保持 10.0.0.242:5060 不变(A/B 同主机, 谁持栈谁收包)。
# VRRP 载体=dummy 口 vision-ha(keepalived 2.0.19 拒绝 lo 跑 VRRP; dummy 不出物理网段, 零 VRID 碰撞面)。
# 独立拉起(不干扰宿主既有 keepalived): systemd keepalived-vision.service
#   (ExecStartPre 建 dummy 口, 幂等)。
global_defs {
    router_id vision-ha
    enable_script_security
    script_user root
}

# 探活 = 主实例 A(vision-platform) 的健康口; interval 2 x fall 2 ≈ 4~6s 判死
vrrp_script chk_vision_primary {
    script "/opt/vision/ha/check-primary.sh"
    interval 2
    fall 2
    rise 2
    timeout 3
}

# 单机无对端形态: BACKUP 起步, 无通告则经 master_down_interval 转 MASTER, 全靠 vrrp_script 驱动翻转
vrrp_instance VI_VISION {
    state BACKUP
    interface vision-ha
    virtual_router_id 51
    priority 100
    nopreempt
    track_script { chk_vision_primary }
    notify_master "/opt/vision/ha/notify.sh master"
    notify_backup "/opt/vision/ha/notify.sh backup"
    notify_fault  "/opt/vision/ha/notify.sh fault"
    notify_stop   "/opt/vision/ha/notify.sh stop"
}
